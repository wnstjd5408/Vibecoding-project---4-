[project]
name = "backend"
version = "0.1.0"
description = "FastAPI 백엔드 골격"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.117",
    "fastapi[standard]>=0.146.0",
    "httpx>=0.28",
    # 사전 이미지 올리기(E22)의 형식 판정·재인코딩
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    {include-group = "importer"},
    "pytest>=9.1.1",
]
importer = [
    "markdown-it-py==4.2.0",
    "defusedxml==0.7.1",
    "pillow>=13.0.0",
    "resvg-py==0.5.0",
    "tinycss2==1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
