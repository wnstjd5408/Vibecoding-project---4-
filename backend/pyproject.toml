[project]
name = "backend"
version = "0.1.0"
description = "FastAPI 백엔드 골격"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.117",
    "fastapi[standard]>=0.146.0",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    {include-group = "importer"},
    "pytest>=9.1.1",
]
importer = [
    "pillow>=13.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
