name: Product tests

on:
  pull_request:
    # Feature integration branches (meg-<n>-integration) collect sub-PRs before a release candidate.
    branches: [main, staging, 'meg-*-integration']
  push:
    branches: [main, staging]

# No environment, secrets, deployment or write access in PR code execution.
permissions:
  contents: read

concurrency:
  group: product-ci-${{ github.event.pull_request.number || github.ref }}
  # Do not cancel a runner while its external staging deployment is building.
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/staging') }}

env:
  CI: "true"
  AWS_EC2_METADATA_DISABLED: "true"
  UV_VERSION: "0.12.23"
  NODE_VERSION: "24.19.0"

jobs:
  # Docs-only PRs (every changed path under docs/ or a root *.md) skip the frontend E2E job.
  # Pushes always run every job.
  changes:
    name: Product changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Classify the PR as docs-only or not
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # One line per file: new path, then the old path for renames (moving code into docs/ is not docs-only).
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | [.filename, (.previous_filename // "")] | @tsv' > files.tsv
          listed=$(wc -l < files.tsv)
          docs_only=true
          # The files API stops at 3,000 entries; an incomplete list is never docs-only.
          if [ "$listed" -eq 0 ] || [ "$listed" -ne "$CHANGED_FILES" ]; then
            docs_only=false
          fi
          while IFS=$'\t' read -r path previous; do
            for p in "$path" "$previous"; do
              [ -n "$p" ] || continue
              case "$p" in
                docs/*) ;;
                */*) docs_only=false ;;
                *.md) ;;
                *) docs_only=false ;;
              esac
            done
          done < files.tsv
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Changed files: $listed, docs_only=$docs_only" >> "$GITHUB_STEP_SUMMARY"

  backend-unit:
    name: Product backend unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked
      - name: Release tree check tests (no remote credentials)
        run: python3 -m unittest discover -s ../.github/scripts -p 'test_release_*.py' -v
      - name: Staging CD guard tests (no remote credentials)
        run: python3 -m unittest discover -s ../.github/scripts -p 'test_staging_*.py' -v
      - name: Unit tests (no remote credentials)
        run: uv run --no-sync pytest tests --ignore=tests/integration --ignore=tests/test_account_issuance_local.py --ignore=tests/test_account_flow_local.py --junitxml=unit-results.xml -q
      - name: Require executed tests without skips
        run: uv run --no-sync python scripts/check_test_report.py unit-results.xml

  backend-sql:
    name: Product backend SQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      AI_LEDGER_TEST_CONTAINER: product-ci-postgres
      GLOSSARY_SQL_TEST_CONTAINER: product-ci-postgres
      NOTION_IMPORT_TEST_CONTAINER: product-ci-postgres
      EMPHASIS_TEST_CONTAINER: product-ci-postgres
      NOTE_WRITE_TEST_CONTAINER: product-ci-postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked
      - name: Start network-isolated disposable PostgreSQL
        run: |
          docker run -d --name product-ci-postgres --network none \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
          for attempt in {1..30}; do
            if docker exec product-ci-postgres pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          echo 'PostgreSQL did not become ready' >&2
          exit 1
      - name: All SQL integration tests
        run: uv run --no-sync pytest tests/integration --junitxml=sql-results.xml -q
      - name: Require executed SQL tests without skips
        run: uv run --no-sync python scripts/check_test_report.py sql-results.xml
      - name: Remove disposable PostgreSQL
        if: always()
        run: |
          if docker container inspect product-ci-postgres >/dev/null 2>&1; then
            docker rm -f product-ci-postgres
          fi

  frontend:
    name: Product frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  frontend-e2e:
    name: Product frontend E2E
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      # notes.spec.ts converts the Notion fixture through the Python importer.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --directory ../backend
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - name: Mock UI tests
        run: npm run test:e2e -- --reporter=list,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/mock.xml
      - name: Require executed mock tests without skips
        run: python3 ../backend/scripts/check_test_report.py test-results/mock.xml
      - name: Notes synthetic HTTP tests
        run: npm run test:e2e:notes -- --reporter=list,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/notes.xml
      - name: Require executed notes tests without skips
        run: python3 ../backend/scripts/check_test_report.py test-results/notes.xml

  product-ci:
    name: Product CI
    if: always()
    needs: [changes, backend-unit, backend-sql, frontend, frontend-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require all jobs to succeed (E2E may skip only on docs-only PRs)
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          UNIT: ${{ needs.backend-unit.result }}
          SQL: ${{ needs.backend-sql.result }}
          BUILD: ${{ needs.frontend.result }}
          E2E: ${{ needs.frontend-e2e.result }}
        run: |
          if [ "$E2E" = skipped ] && [ "$CHANGES" = success ] && [ "$DOCS_ONLY" = true ]; then
            echo 'Docs-only PR: frontend E2E skipped by design.'
            E2E=success
          fi
          for result in "$CHANGES" "$UNIT" "$SQL" "$BUILD" "$E2E"; do
            if [ "$result" != success ]; then
              echo 'A required product job failed, was skipped or was cancelled.' >&2
              exit 1
            fi
          done

  staging-cd:
    name: Staging CD
    needs: product-ci
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/staging' &&
      needs.product-ci.result == 'success' && vars.STAGING_CD_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write # Short-lived identity for Preview-only Trusted Sources smoke
    environment: staging-cd
    concurrency:
      group: staging-cd
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deploy the tested staging SHA and wait for Ready
        id: deploy
        run: python3 .github/scripts/staging_cd.py
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          PRODUCT_CI_RESULT: ${{ needs.product-ci.result }}
      - name: Verify the Ready deployment health contract
        if: steps.deploy.outputs.deployment_id != '' && vars.STAGING_SMOKE_ENABLED == 'true'
        run: python3 .github/scripts/staging_smoke.py
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          PRODUCT_CI_RESULT: ${{ needs.product-ci.result }}
          STAGING_DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
      - name: Record smoke not enabled
        if: steps.deploy.outputs.deployment_id != '' && vars.STAGING_SMOKE_ENABLED != 'true'
        run: echo 'SMOKE_NOT_RUN — enable only after Preview Trusted Sources is configured; Ready is not smoke success.' >> "$GITHUB_STEP_SUMMARY"
