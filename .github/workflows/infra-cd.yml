name: Infra CD

# infra/ 변경을 main에 병합하면 plan을 만들고, 사람이 승인한 뒤 같은 plan을 적용한다(MEG-100).
# - pull_request 트리거는 두지 않는다. PR 검토 때는 로컬 plan을 쓴다.
# - 저장소가 공개라서 로그와 아티팩트도 공개된다. plan 파일과 Terraform 출력에는 이메일·금액·계정 ID가
#   들어가므로 전체 출력은 로그에 찍지 않고 요약 줄과 리소스 주소만 남긴다. plan 파일은 아티팩트 대신
#   비공개 상태 버킷의 plans/ 아래로 넘긴다.
# - 비밀값은 main으로 제한한 Environment(infra-plan, infra-apply)에만 둔다.
#   infra-apply에는 필수 승인자를 둔다. 설정 방법은 infra/README.md의 "CD로 적용" 절을 따른다.
on:
  push:
    branches: [main]
    # plan 결과를 바꾸는 파일만 본다. README·예시 파일만 바꾼 병합은 실행하지 않는다.
    # infra/*는 하위 폴더를 포함하지 않아 역할 코드(infra/github-oidc)는 CD 대상이 아니다.
    # 역할 코드는 사람이 로컬에서 apply한다.
    paths:
      - "infra/*.tf"
      - "infra/.terraform.lock.hcl"
  workflow_dispatch:

permissions: {}

# 한 번에 하나만 실행한다. 승인 대기 중인 실행을 취소하지 않는다.
concurrency:
  group: infra-cd
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  STATE_REGION: ap-northeast-2
  # STS 호출 리전. infra/alerts.tf의 OIDC 실패 알림 규칙이 이 리전을 본다(sts_event_region 기본값).
  STS_REGION: ap-northeast-1

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: infra-plan
    permissions:
      id-token: write
      contents: read
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      plan_key: ${{ steps.plan.outputs.plan_key }}
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          # 래퍼가 출력을 그대로 로그에 옮기지 않게 한다.
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.STS_REGION }}

      - name: Init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          if ! terraform init -input=false -no-color \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${STATE_REGION}" > "${RUNNER_TEMP}/init.log" 2>&1; then
            echo "::error::terraform init 실패. 공개 로그라서 출력을 남기지 않는다."
            exit 1
          fi
          echo "terraform init 성공"

      - name: Plan
        id: plan
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          # 변수 값 전체를 한 줄 JSON 비밀값 하나로 받는다. 값마다 비밀값으로 두면 짧은 값
          # (예: 예산 10)이 로그의 다른 숫자까지 가린다.
          TF_VARS_JSON: ${{ secrets.TF_VARS_JSON }}
        run: |
          printf '%s' "${TF_VARS_JSON}" > "${RUNNER_TEMP}/terraform.tfvars.json"
          plan_file="${RUNNER_TEMP}/plan.tfplan"

          code=0
          terraform plan -input=false -no-color -detailed-exitcode \
            -var-file="${RUNNER_TEMP}/terraform.tfvars.json" \
            -out="${plan_file}" > "${RUNNER_TEMP}/plan.log" 2>&1 || code=$?

          if [ "${code}" -eq 1 ]; then
            echo "::error::terraform plan 실패. 공개 로그라서 출력을 남기지 않는다."
            exit 1
          fi

          grep -E '^(Plan:|No changes\.)' "${RUNNER_TEMP}/plan.log" || true

          if [ "${code}" -eq 0 ]; then
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            echo "변경이 없어 apply를 건너뛴다."
            exit 0
          fi

          # 승인자가 무엇이 바뀌는지 볼 수 있게 리소스 주소와 동작만 남긴다. 값은 남기지 않는다.
          echo "승인할 변경:"
          terraform show -json "${plan_file}" | jq -r '
            .resource_changes[]
            | select(.change.actions != ["no-op"] or .change.importing != null)
            | (if .change.importing != null then "import+" else "" end)
              + (.change.actions | join("+")) + "  " + .address' | sort

          plan_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tfplan"
          aws s3 cp "${plan_file}" "s3://${TF_STATE_BUCKET}/plans/${plan_key}" --only-show-errors
          echo "has_changes=true" >> "${GITHUB_OUTPUT}"
          echo "plan_key=${plan_key}" >> "${GITHUB_OUTPUT}"
          echo "plan 파일을 상태 버킷에 올렸다. 승인 후 apply가 내려받는다."

  apply:
    name: Apply
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 필수 승인자가 있는 Environment. 승인 전에는 이 job이 시작되지 않는다.
    environment: infra-apply
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.STS_REGION }}

      - name: Init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          if ! terraform init -input=false -no-color \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${STATE_REGION}" > "${RUNNER_TEMP}/init.log" 2>&1; then
            echo "::error::terraform init 실패. 공개 로그라서 출력을 남기지 않는다."
            exit 1
          fi
          echo "terraform init 성공"

      - name: Download plan
        id: download
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          PLAN_KEY: ${{ needs.plan.outputs.plan_key }}
        run: |
          aws s3 cp "s3://${TF_STATE_BUCKET}/plans/${PLAN_KEY}" "${RUNNER_TEMP}/plan.tfplan" --only-show-errors
          echo "plan 파일을 내려받았다."

      # 저장된 plan만 적용한다. 그 사이 상태가 바뀌었으면 Terraform이 거부한다.
      - name: Apply
        run: |
          code=0
          terraform apply -input=false -no-color "${RUNNER_TEMP}/plan.tfplan" \
            > "${RUNNER_TEMP}/apply.log" 2>&1 || code=$?
          grep -E '^Apply complete!' "${RUNNER_TEMP}/apply.log" || true
          if [ "${code}" -ne 0 ]; then
            echo "::error::terraform apply 실패(종료 코드 ${code}). 공개 로그라서 출력을 남기지 않는다. 승인자가 로컬에서 확인한다."
            exit 1
          fi

      # 성공·실패와 관계없이 지운다. 적용했거나 상태가 바뀌어 다시 쓸 수 없는 파일이다.
      - name: Delete plan file
        if: always() && steps.download.conclusion == 'success'
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          PLAN_KEY: ${{ needs.plan.outputs.plan_key }}
        run: |
          aws s3 rm "s3://${TF_STATE_BUCKET}/plans/${PLAN_KEY}" --only-show-errors
          echo "plan 파일을 지웠다."
