name: Wiki evaluation regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Wiki eval offline regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
          python-version: '3.12'
      - run: uv sync --locked
      - name: Run offline evaluation contracts
        run: >-
          uv run --no-sync pytest
          tests/test_eval_wiki_live.py tests/test_eval_wiki_live_review.py
          tests/test_eval_wiki_dev.py tests/test_eval_runner.py
          tests/test_eval_scoring.py tests/test_eval_dataset.py
          tests/test_eval_live.py tests/test_eval_wiki_quality.py -q
