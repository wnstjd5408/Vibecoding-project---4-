name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check-title:
    name: Check PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore)\(MEG-[0-9]+\): .+'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "OK: $PR_TITLE"
          else
            echo "::error::PR 제목이 형식에 맞지 않습니다: $PR_TITLE"
            echo "형식: <type>(MEG-N): <설명>  (type: feat, fix, docs, chore)"
            echo "예: docs(MEG-12): 첫 실험 설계 문서 추가"
            exit 1
          fi
