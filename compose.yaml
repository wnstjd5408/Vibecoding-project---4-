services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    env_file: ./.local-backend/compose-backend.env
    networks: [default, supabase]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_MOCK: 'false'
      LOCAL_API_TARGET: http://backend:8000
    ports: ['127.0.0.1:5173:5173']
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
networks:
  supabase:
    external: true
    name: ${LOCAL_SUPABASE_NETWORK:?Use scripts.local_compose up}
