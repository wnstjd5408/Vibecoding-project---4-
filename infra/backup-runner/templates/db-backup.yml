name: Private DB Backup

# Install ONLY in the private operations repository. See ../README.md.
on:
  schedule:
    # 매주 월요일 03:00 KST(일요일 18:00 UTC). GitHub 예약 실행은 몇 분~수십 분 늦을 수 있다.
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      note_images:
        description: "노트 이미지도 백업한다(Notion 가져오기 직후 1회, 지우지 않고 보관)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  # infra/db-backup의 home_region과 같아야 한다.
  BACKUP_REGION: ap-northeast-2

jobs:
  start:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Validate reviewed source commit
        env:
          SOURCE_COMMIT: ${{ vars.SOURCE_COMMIT }}
        run: '[[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]'
      - name: Lifecycle credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.RUNNER_LIFECYCLE_ROLE_ARN }}
          aws-region: ${{ env.BACKUP_REGION }}
          mask-aws-account-id: true
      - name: Start runner
        env:
          INSTANCE_ID: ${{ vars.RUNNER_INSTANCE_ID }}
        run: |
          set -euo pipefail
          [[ "$INSTANCE_ID" =~ ^i-[a-f0-9]+$ ]]
          # A previous stop can still be in progress. Never reuse an old boot timer.
          aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID" > /dev/null 2>&1
          aws ec2 start-instances --instance-ids "$INSTANCE_ID" > /dev/null 2>&1
          aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID" > /dev/null 2>&1

  backup:
    needs: start
    name: Backup
    runs-on: [self-hosted, Linux, X64, backup-fixed-ip]
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: wnstjd5408/Vibecoding-project---4-
          ref: ${{ vars.SOURCE_COMMIT }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Private file permissions
        run: |
          echo 'umask 077' >> "$RUNNER_TEMP/private-shell.sh"
          echo "BASH_ENV=$RUNNER_TEMP/private-shell.sh" >> "$GITHUB_ENV"

      # 노트 이미지를 요청했는데 버킷 변수가 없으면 백업된 줄 알고 넘어가지 않게 처음에 멈춘다.
      - name: Check inputs
        if: inputs.note_images == true && vars.NOTE_IMAGE_BUCKET == ''
        run: |
          echo "::error::note_images를 요청했지만 NOTE_IMAGE_BUCKET 변수가 없다"
          exit 1

      # 저장소 루트 package.json에 고정한 Supabase CLI. db dump는 Docker로 pg_dump를 돌린다.
      # 이 단계에는 비밀값이 없어 실패하면 로그 끝부분을 보여 준다.
      - name: Install Supabase CLI
        run: |
          if ! npm ci --no-audit --no-fund > "${RUNNER_TEMP}/npm.log" 2>&1; then
            tail -n 30 "${RUNNER_TEMP}/npm.log"
            echo "::error::npm ci 실패"
            exit 1
          fi

      - name: Set backup id
        id: stamp
        run: echo "stamp=$(date -u +%Y-%m-%dT%H%MZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      # Supabase 문서의 CLI 백업 방식대로 roles·schema·data 세 파일을 만든다. data에는 auth·storage 스키마도 들어간다.
      # 출력에 접속 정보가 섞일 수 있어 로그에 옮기지 않는다. --dry-run은 비밀번호를 찍으므로 쓰지 않는다.
      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash backend/scripts/dump_database.sh
      # 복원 시험(AC-4)에서 비교할 표별 행 수. 데이터 덤프의 COPY 블록을 세므로 덤프와 같은 시점이고
      # 모든 표가 들어간다(COPY 텍스트 형식은 한 행이 한 줄이다). 사용자 수가 있어 로그에 찍지 않는다.
      - name: Count rows
        env:
          STAMP: ${{ steps.stamp.outputs.stamp }}
        run: |
          cd "${RUNNER_TEMP}/backup/db"
          # COPY 블록은 역슬래시와 점만 있는 줄(\.)로 끝난다. 역슬래시는 이스케이프가 꼬이지 않게 문자 코드로 만든다.
          awk 'BEGIN { end_mark = sprintf("%c.", 92) }
               /^COPY /{ name = $2; gsub(/"/, "", name); n = 0; inside = 1; next }
               inside && $0 == end_mark { print name, n; inside = 0; next }
               inside { n++ }' data.sql > counts.txt
          if [ ! -s counts.txt ]; then
            echo "::error::행 수를 세지 못했다"
            exit 1
          fi
          printf '{"backup_id": "%s", "commit": "%s"}\n' "${STAMP}" "$(git rev-parse HEAD)" > backup-info.json
          echo "표 $(wc -l < counts.txt)개의 행 수를 counts.txt에 남겼다"

      - name: Bundle
        run: |
          cd "${RUNNER_TEMP}/backup/db"
          gzip -9 roles.sql schema.sql data.sql
          tar -cf "${RUNNER_TEMP}/backup/backup.tar" roles.sql.gz schema.sql.gz data.sql.gz counts.txt backup-info.json
          stat -c '%n %s bytes' *

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.BACKUP_REGION }}
          mask-aws-account-id: true

      # AC-2 근거: 백업 ID와 파일 크기만 로그에 남긴다. AWS 오류 원문에는 계정 ID·역할 이름이 들어 있어 숨긴다.
      - name: Upload database backup
        env:
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          STAMP: ${{ steps.stamp.outputs.stamp }}
        run: |
          cd "${RUNNER_TEMP}/backup"
          if ! aws s3 cp backup.tar "s3://${BACKUP_BUCKET}/db/latest/backup.tar" --only-show-errors \
            > "${RUNNER_TEMP}/upload-db.log" 2>&1; then
            echo "::error::DB 백업 업로드 실패. 공개 로그라서 오류 원문을 남기지 않는다. CloudTrail에서 확인한다."
            exit 1
          fi
          echo "DB 백업 ${STAMP}"
          stat -c '%n %s bytes' backup.tar

      # 사전 이미지(주 1회)와 노트 이미지(수동 1회). 버킷 이름은 Environment 변수로 받는다.
      # 사전 이미지 버킷이 아직 없으면(변수 미설정) 건너뛴다. 파일이 없는 행이 있으면 받은 파일은 먼저 올리고
      # 마지막에 실패로 끝내 사람에게 알린다.
      - name: Back up images
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          STAMP: ${{ steps.stamp.outputs.stamp }}
          GLOSSARY_IMAGE_BUCKET: ${{ vars.GLOSSARY_IMAGE_BUCKET }}
          NOTE_IMAGE_BUCKET: ${{ vars.NOTE_IMAGE_BUCKET }}
          INCLUDE_NOTE_IMAGES: ${{ inputs.note_images == true }}
        run: |
          missing=0
          backup() {
            bucket="$1"; table="$2"; dest="$3"
            out="${RUNNER_TEMP}/backup/${table}"
            code=0
            # 업로드한 DB 덤프와 같은 파일에서 경로를 읽는다. 덤프 후 삭제된 행도 대조한다.
            python3 backend/scripts/backup_images.py --bucket "${bucket}" --table "${table}" \
              --dump "${RUNNER_TEMP}/backup/db/data.sql.gz" --out "${out}" || code=$?
            if [ "${code}" -ne 0 ] && [ "${code}" -ne 3 ]; then
              echo "::error::${table} 이미지 백업 실패"
              exit 1
            fi
            printf '{"backup_id": "%s"}\n' "${STAMP}" > "${out}/backup-info.json"
            # 파일 경로가 로그에 찍히지 않게 tar에 v 옵션을 쓰지 않는다.
            archive="${RUNNER_TEMP}/backup/${table}.tar"
            tar -cf "${archive}" -C "${out}" .
            if ! aws s3 cp "${archive}" "s3://${BACKUP_BUCKET}/${dest}" --only-show-errors \
              > "${RUNNER_TEMP}/upload-${table}.log" 2>&1; then
              echo "::error::${table} 업로드 실패. 공개 로그라서 오류 원문을 남기지 않는다."
              exit 1
            fi
            echo "${table}: ${dest}에 올렸다 ($(stat -c '%s' "${archive}") bytes)"
            if [ "${code}" -eq 3 ]; then
              echo "::error::${table}: 파일이 없는 행이 있다(manifest.json 확인)"
              missing=1
            fi
          }
          if [ -n "${GLOSSARY_IMAGE_BUCKET}" ]; then
            backup "${GLOSSARY_IMAGE_BUCKET}" glossary_images glossary-images/latest/images.tar
          else
            echo "glossary_images: GLOSSARY_IMAGE_BUCKET 변수가 없어 건너뛴다"
          fi
          if [ "${INCLUDE_NOTE_IMAGES}" = "true" ]; then
            backup "${NOTE_IMAGE_BUCKET}" note_images "note-images/${STAMP}/images.tar"
          fi
          exit "${missing}"

      - name: Remove local backup and diagnostic files
        if: always()
        run: |
          # This runner is dedicated to this serialized workflow.
          docker ps -aq | xargs -r docker rm -f > /dev/null
          rm -rf -- "$RUNNER_TEMP/backup"
          find "$RUNNER_TEMP" -maxdepth 1 -type f \( -name '*.log' \) -delete

  stop:
    needs: [start, backup]
    if: always() && github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Lifecycle credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.RUNNER_LIFECYCLE_ROLE_ARN }}
          aws-region: ${{ env.BACKUP_REGION }}
          mask-aws-account-id: true
      - name: Stop runner
        env:
          INSTANCE_ID: ${{ vars.RUNNER_INSTANCE_ID }}
        run: |
          set -euo pipefail
          [[ "$INSTANCE_ID" =~ ^i-[a-f0-9]+$ ]]
          aws ec2 stop-instances --instance-ids "$INSTANCE_ID" > /dev/null 2>&1
          aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID" > /dev/null 2>&1
